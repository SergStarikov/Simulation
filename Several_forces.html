<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляція Векторів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #canvas-container {
            cursor: crosshair;
        }

        .draggable-hover {
            cursor: grab !important;
        }

        .dragging {
            cursor: grabbing !important;
        }

        /* Кастомний скролбар для панелі */
        #sidebar::-webkit-scrollbar {
            width: 6px;
        }

        #sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        #sidebar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen flex">

    <!-- Ліва панель -->
    <div id="sidebar"
        class="w-80 bg-white shadow-lg h-full flex flex-col z-10 border-r border-gray-200 overflow-y-auto">
        <div class="p-5 border-b border-gray-200 bg-gray-50 sticky top-0">
            <h1 class="text-xl font-bold text-gray-800">Вектори</h1>
            <p class="text-xs text-gray-500 mt-1">Клікніть на тілі, щоб створити силу з будь-якої точки. Alt+клік —
                перетягнути тіло. Перетягуйте кінці для
                редагування.</p>
            <button id="clear-btn"
                class="mt-3 w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded transition-colors text-sm">
                Очистити всі
            </button>
            <div class="mt-4 pt-4 border-t border-gray-200">
                <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                    <input type="checkbox" id="show-resultant" class="rounded text-blue-500 focus:ring-blue-500">
                    <span>Показувати рівнодійну (суму сил)</span>
                </label>
                <div id="resultant-stats" class="text-xs text-gray-500 mt-2 hidden"></div>
            </div>
        </div>
        <div id="vector-list" class="p-4 flex flex-col gap-3">
            <!-- Список векторів буде генеруватись тут -->
            <div class="text-gray-400 text-sm text-center mt-10" id="empty-state">
                Немає доданих векторів
            </div>
        </div>
    </div>

    <!-- Полотно (Canvas) -->
    <div id="canvas-container" class="flex-1 relative bg-white">
        <canvas id="sim-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const vectorListEl = document.getElementById('vector-list');
        const emptyStateEl = document.getElementById('empty-state');
        const clearBtn = document.getElementById('clear-btn');

        // Стан додатку
        let vectors = [];
        let nextId = 1;
        let mode = 'idle'; // 'idle', 'drawing', 'dragging', 'dragging_body'

        let currentVector = null; // Вектор, що малюється
        let dragTarget = null; // { type, vector, point } або { offsetX, offsetY }
        let hoveredTarget = null; // Для зміни курсору

        // Тіло для прикладання сил
        let physicsBody = { x: null, y: null, width: 180, height: 113 };

        // Налаштування
        const POINT_RADIUS = 2;
        const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
        const PIXELS_PER_NEWTON = 100; // 100 пікселів = 1 Н

        function pxToNewtons(px) {
            return (px / PIXELS_PER_NEWTON).toFixed(2);
        }

        // Ініціалізація розмірів
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            if (physicsBody.x === null) {
                physicsBody.x = canvas.width / 2;
                physicsBody.y = canvas.height / 2;
            }
            draw();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Допоміжні функції
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function distance(p1, p2) {
            return Math.hypot(p2.x - p1.x, p2.y - p1.y);
        }

        function getVectorStats(v) {
            const dx = v.end.x - v.start.x;
            const dy = -(v.end.y - v.start.y); // Інвертуємо Y для математичного кута (вгору = +)
            const length = Math.hypot(dx, dy);
            let angle = Math.atan2(dy, dx) * (180 / Math.PI);
            if (angle < 0) angle += 360;
            return { dx, dy, length, angle };
        }

        // Перевірка чи миша над якоюсь точкою (початок/кінець вектора або тіло)
        function getHitTarget(pos) {
            // 1. Перевіряємо кінці векторів (найвищий пріоритет)
            for (let i = vectors.length - 1; i >= 0; i--) {
                const v = vectors[i];
                if (distance(pos, v.end) <= POINT_RADIUS + 4) return { type: 'vector', vector: v, point: 'end' };
                if (distance(pos, v.start) <= POINT_RADIUS + 4) return { type: 'vector', vector: v, point: 'start' };
            }

            // 2. Перевірка тіла (клік = малювання сили, Alt+клік = перетягування)
            const hw = physicsBody.width / 2;
            const hh = physicsBody.height / 2;
            if (pos.x >= physicsBody.x - hw && pos.x <= physicsBody.x + hw &&
                pos.y >= physicsBody.y - hh && pos.y <= physicsBody.y + hh) return { type: 'body' };

            return null;
        }

        // Перевірка чи точка знаходиться всередині тіла
        function isInsideBody(pos) {
            const hw = physicsBody.width / 2;
            const hh = physicsBody.height / 2;
            return pos.x >= physicsBody.x - hw && pos.x <= physicsBody.x + hw &&
                pos.y >= physicsBody.y - hh && pos.y <= physicsBody.y + hh;
        }

        // --- Обробники подій миші ---

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            const target = getHitTarget(pos);

            if (target) {
                if (target.type === 'vector') {
                    // Починаємо перетягувати існуючу точку
                    mode = 'dragging';
                    dragTarget = target;
                    if (target.point === 'start') target.vector.attached = false;
                    container.classList.add('dragging');
                } else if (target.type === 'body' && e.altKey) {
                    // Alt+клік — перетягувати тіло
                    mode = 'dragging_body';
                    dragTarget = { offsetX: pos.x - physicsBody.x, offsetY: pos.y - physicsBody.y };
                    container.classList.add('dragging');
                } else if (target.type === 'body') {
                    // Клік на тілі — малювати новий вектор (силу) від точки кліку
                    mode = 'drawing';
                    const color = COLORS[(nextId - 1) % COLORS.length];
                    currentVector = {
                        id: nextId++,
                        name: `F${nextId - 1}`,
                        start: { ...pos },
                        end: { ...pos },
                        color: color,
                        attached: true
                    };
                }
            } else {
                // Починаємо малювати новий вектор у вільному просторі
                mode = 'drawing';
                const color = COLORS[(nextId - 1) % COLORS.length];
                currentVector = {
                    id: nextId++,
                    name: `v${nextId - 1}`,
                    start: { ...pos },
                    end: { ...pos },
                    color: color,
                    attached: false
                };
            }
            draw();
        });

        canvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);

            if (mode === 'drawing' && currentVector) {
                currentVector.end = { ...pos };
                draw();
            } else if (mode === 'dragging' && dragTarget && dragTarget.type === 'vector') {
                let newPos = { ...pos };
                // Примагнічування початку вектора до тіла при наближенні
                if (dragTarget.point === 'start' && isInsideBody(pos)) {
                    newPos = { ...pos }; // Прикріплюємо в точці де знаходиться миша
                }
                dragTarget.vector[dragTarget.point] = newPos;
                updateSidebar(); // Оновлюємо дані в реальному часі
                draw();
            } else if (mode === 'dragging_body') {
                const oldX = physicsBody.x;
                const oldY = physicsBody.y;

                physicsBody.x = pos.x - dragTarget.offsetX;
                physicsBody.y = pos.y - dragTarget.offsetY;

                const dx = physicsBody.x - oldX;
                const dy = physicsBody.y - oldY;

                // Переміщуємо всі прикріплені вектори разом з тілом
                vectors.forEach(v => {
                    if (v.attached) {
                        v.start.x += dx;
                        v.start.y += dy;
                        v.end.x += dx;
                        v.end.y += dy;
                    }
                });
                updateSidebar();
                draw();
            } else {
                // Зміна курсору при наведенні
                const target = getHitTarget(pos);
                if (target !== hoveredTarget) {
                    hoveredTarget = target;

                    container.classList.remove('draggable-hover');
                    container.style.cursor = 'crosshair'; // Скидання

                    if (target) {
                        if (target.type === 'body') {
                            container.style.cursor = 'crosshair'; // Малювання сили з тіла
                        } else {
                            container.classList.add('draggable-hover');
                            container.style.cursor = 'grab'; // Перетягування точок
                        }
                    }
                    draw();
                }
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (mode === 'drawing' && currentVector) {
                // Додаємо вектор тільки якщо він має хоч якусь довжину
                if (distance(currentVector.start, currentVector.end) > 5) {
                    vectors.push(currentVector);
                    updateSidebar();
                } else {
                    nextId--; // Відкочуємо ID якщо клік був випадковий
                }
                currentVector = null;
            } else if (mode === 'dragging' && dragTarget && dragTarget.point === 'start') {
                // Перевіряємо чи прикріпився вектор до тіла після відпускання
                if (isInsideBody(dragTarget.vector.start)) {
                    dragTarget.vector.attached = true;
                    if (dragTarget.vector.name.startsWith('v')) {
                        dragTarget.vector.name = dragTarget.vector.name.replace('v', 'F');
                    }
                }
                updateSidebar();
            }

            mode = 'idle';
            dragTarget = null;
            container.classList.remove('dragging');
            container.style.cursor = '';
            draw();
        });

        canvas.addEventListener('mouseleave', () => {
            if (mode === 'drawing') {
                currentVector = null;
                mode = 'idle';
                draw();
            }
        });

        // --- Малювання ---

        function drawGrid() {
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            const step = 50;

            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += step) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for (let y = 0; y <= canvas.height; y += step) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function drawBody() {
            ctx.save();
            ctx.translate(physicsBody.x, physicsBody.y);

            const hw = physicsBody.width / 2;
            const hh = physicsBody.height / 2;
            const r = 6; // border radius for rounded corners

            // Основне тіло (прямокутник)
            ctx.fillStyle = '#cbd5e1';
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.roundRect(-hw, -hh, physicsBody.width, physicsBody.height, r);
            ctx.fill();
            ctx.stroke();

            // Маленький хрестик в центрі (орієнтир)
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
            ctx.moveTo(0, -6); ctx.lineTo(0, 6);
            ctx.stroke();


            // Підказка
            const isBodyHovered = hoveredTarget && hoveredTarget.type === 'body';
            if (isBodyHovered) {
                ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
                ctx.font = '10px sans-serif';
                ctx.fillText('клік — сила / Alt+клік — рухати', 0, hh + 16);
            }

            ctx.restore();
        }

        function drawResultantForce() {
            const showBtn = document.getElementById('show-resultant');
            if (!showBtn || !showBtn.checked) {
                const statsEl = document.getElementById('resultant-stats');
                if (statsEl) statsEl.classList.add('hidden');
                return;
            }

            // Збираємо всі прикріплені сили
            const attachedForces = vectors.filter(v => v.attached);
            if (attachedForces.length === 0) {
                const statsEl = document.getElementById('resultant-stats');
                if (statsEl) statsEl.classList.add('hidden');
                return;
            }

            // 1. Обчислення рівнодійної сили (векторна сума) та сумарного моменту
            let sumFx = 0;
            let sumFy = 0;
            let totalTorque = 0; // Момент відносно центру

            attachedForces.forEach(v => {
                const fx = v.end.x - v.start.x;
                const fy = v.end.y - v.start.y;
                sumFx += fx;
                sumFy += fy;

                const rx = v.start.x - physicsBody.x;
                const ry = v.start.y - physicsBody.y;
                totalTorque += (rx * fy - ry * fx);
            });

            // Малюємо вектор рівнодійної
            const rSq = sumFx * sumFx + sumFy * sumFy;
            const rLength = Math.sqrt(rSq);
            if (rLength > 1) {
                // Зміщуємо точку прикладання рівнодійної так, 
                // щоб вона створювала правильний еквівалентний момент:
                // r_x * R_y - r_y * R_x = totalTorque
                // Вектор зміщення, перпендикулярний до рівнодійної:
                const shiftX = (totalTorque * sumFy) / rSq;
                const shiftY = -(totalTorque * sumFx) / rSq;

                const startX = physicsBody.x + shiftX;
                const startY = physicsBody.y + shiftY;
                const endX = startX + sumFx;
                const endY = startY + sumFy;
                const headlen = 16;
                const angle = Math.atan2(sumFy, sumFx);

                ctx.save();
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 4;
                ctx.setLineDash([8, 8]);

                // Лінія дії рівнодійної (необов'язково, але допомагає зрозуміти зміщення)
                if (Math.abs(shiftX) > 1 || Math.abs(shiftY) > 1) {
                    ctx.beginPath();
                    ctx.moveTo(physicsBody.x, physicsBody.y);
                    ctx.lineTo(startX, startY);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
                    ctx.stroke();
                }

                ctx.lineWidth = 4;
                ctx.strokeStyle = '#10b981';
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                ctx.setLineDash([]);
                ctx.fillStyle = '#10b981';
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 7), endY - headlen * Math.sin(angle - Math.PI / 7));
                ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 7), endY - headlen * Math.sin(angle + Math.PI / 7));
                ctx.fill();

                // Підпис рівнодійної — F⃗ без індексу
                drawVectorLabel(endX + 10, endY + 6, null, '#047857');
                ctx.restore();
            }

            // 4. Оновлюємо UI панель
            const statsEl = document.getElementById('resultant-stats');
            if (statsEl) {
                // Кут у математичній системі координат (вгору = +Y)
                let resAngle = Math.atan2(-sumFy, sumFx) * (180 / Math.PI);
                if (resAngle < 0) resAngle += 360;

                const hasForce = rLength > 1;
                statsEl.innerHTML = `
                    <div class="bg-emerald-50 p-2 rounded border border-emerald-200 mt-2">
                        <p class="font-bold text-emerald-700">Рівнодійна сила (F):</p>
                        ${hasForce ? `
                            <p>Fx: ${Math.round(sumFx)}, Fy: ${Math.round(-sumFy)}</p>
                            <p>|F|: ${pxToNewtons(rLength)} Н</p>
                            <p>Кут: ${Math.round(resAngle)}°</p>
                        ` : `<p class="text-gray-500">≈ 0 (сили врівноважені)</p>`}
                    </div>
                `;
                statsEl.classList.remove('hidden');
            }
        }

        // Малює підпис вектора: F з індексом та знаком вектора (стрілка зверху)
        function drawVectorLabel(x, y, index, color) {
            ctx.save();
            ctx.fillStyle = color || '#333';

            // Літера F
            ctx.font = 'bold italic 16px serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('F', x, y);
            const fWidth = ctx.measureText('F').width;

            // Стрілка-вектор над F (→)
            const arrowY = y - 16;
            const arrowStartX = x;
            const arrowEndX = x + fWidth;
            ctx.strokeStyle = color || '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(arrowStartX, arrowY);
            ctx.lineTo(arrowEndX, arrowY);
            ctx.stroke();
            // Вістря стрілки
            ctx.beginPath();
            ctx.moveTo(arrowEndX, arrowY);
            ctx.lineTo(arrowEndX - 4, arrowY - 3);
            ctx.moveTo(arrowEndX, arrowY);
            ctx.lineTo(arrowEndX - 4, arrowY + 3);
            ctx.stroke();

            // Індекс (маленький, внизу справа)
            if (index !== undefined && index !== null) {
                ctx.font = 'bold 10px serif';
                ctx.fillText(String(index), x + fWidth + 1, y + 4);
            }

            ctx.restore();
        }

        function drawVector(v, isDrawing = false) {
            const { start, end, color } = v;
            const headlen = 16;
            const angle = Math.atan2(end.y - start.y, end.x - start.x);

            // Лінія
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();

            // Стрілка
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(end.x, end.y);
            ctx.lineTo(end.x - headlen * Math.cos(angle - Math.PI / 7), end.y - headlen * Math.sin(angle - Math.PI / 7));
            ctx.lineTo(end.x - headlen * Math.cos(angle + Math.PI / 7), end.y - headlen * Math.sin(angle + Math.PI / 7));
            ctx.fill();

            // Точки для перетягування (з'являються лише при натисканні миші або наведенні)
            if (!isDrawing) {
                const isStartHovered = hoveredTarget && hoveredTarget.type === 'vector' && hoveredTarget.vector === v && hoveredTarget.point === 'start';
                const isEndHovered = hoveredTarget && hoveredTarget.type === 'vector' && hoveredTarget.vector === v && hoveredTarget.point === 'end';
                const isDraggingThis = mode === 'dragging' && dragTarget && dragTarget.vector === v;
                const showPoints = isStartHovered || isEndHovered || isDraggingThis;

                if (showPoints) {
                    // Якщо вектор прикріплений, не малюємо точку на початку (там вже є центр тіла)
                    if (!v.attached) {
                        drawPoint(start.x, start.y, color, isStartHovered);
                    }
                    drawPoint(end.x, end.y, color, isEndHovered);
                }
            }

            // Підпис вектора (F⃗ з індексом)
            if (!isDrawing && distance(start, end) > 20) {
                const midX = (start.x + end.x) / 2;
                const midY = (start.y + end.y) / 2 - 10;
                // Витягуємо числовий індекс з імені (F1 → 1, F2 → 2, v3 → 3)
                const idx = v.name.replace(/[^0-9]/g, '');
                drawVectorLabel(midX, midY, idx, '#333');
            }
        }

        function drawPoint(x, y, color, isHovered) {
            ctx.beginPath();
            ctx.arc(x, y, POINT_RADIUS + (isHovered ? 2 : 0), 0, 2 * Math.PI);
            ctx.fillStyle = isHovered ? '#fff' : color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        // Легенда масштабу (1 ньютон)
        function drawScaleLegend() {
            const barLength = PIXELS_PER_NEWTON; // 1 Н у пікселях
            const margin = 30;
            const barY = canvas.height - margin;
            const barX = canvas.width - margin - barLength;

            ctx.save();

            // Лінія масштабу
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(barX, barY);
            ctx.lineTo(barX + barLength, barY);
            ctx.stroke();

            // Засічки на кінцях
            const tickH = 8;
            ctx.beginPath();
            ctx.moveTo(barX, barY - tickH);
            ctx.lineTo(barX, barY + tickH);
            ctx.moveTo(barX + barLength, barY - tickH);
            ctx.lineTo(barX + barLength, barY + tickH);
            ctx.stroke();

            // Підпис
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('1 Н', barX + barLength / 2, barY + tickH + 4);

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawBody();

            vectors.forEach(v => drawVector(v));
            if (currentVector) drawVector(currentVector, true);

            drawResultantForce();
            drawScaleLegend();
        }

        // --- UI Панелі ---

        function deleteVector(id) {
            vectors = vectors.filter(v => v.id !== id);
            hoveredTarget = null;
            updateSidebar();
            draw();
        }

        function updateSidebar() {
            vectorListEl.innerHTML = '';

            if (vectors.length === 0) {
                vectorListEl.appendChild(emptyStateEl);
                return;
            }

            vectors.forEach(v => {
                const stats = getVectorStats(v);
                const attachedBadge = v.attached ? `<span class="bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded ml-2">Прикріплено</span>` : '';

                const card = document.createElement('div');
                card.className = 'bg-white border border-gray-200 rounded-lg p-3 shadow-sm relative overflow-hidden transition-all';
                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-1.5 h-full" style="background-color: ${v.color}"></div>
                    <div class="pl-2 flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-800 flex items-center gap-1">
                                <span class="font-mono bg-gray-100 px-1 rounded">${v.name}</span>
                                ${attachedBadge}
                            </h3>
                            <div class="text-xs text-gray-500 mt-1 space-y-1">
                                <p><span class="font-semibold text-gray-600">Комп:</span> X: ${Math.round(stats.dx)}, Y: ${Math.round(stats.dy)}</p>
                                <p><span class="font-semibold text-gray-600">Сила:</span> ${pxToNewtons(stats.length)} Н</p>
                                <p><span class="font-semibold text-gray-600">Кут:</span> ${Math.round(stats.angle)}°</p>
                            </div>
                        </div>
                        <button onclick="deleteVector(${v.id})" class="text-gray-400 hover:text-red-500 transition-colors p-1" title="Видалити вектор">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                            </svg>
                        </button>
                    </div>
                `;

                // Підсвічування при наведенні на картку
                card.addEventListener('mouseenter', () => {
                    hoveredTarget = { type: 'vector', vector: v, point: null };
                    draw();
                });
                card.addEventListener('mouseleave', () => {
                    hoveredTarget = null;
                    draw();
                });

                vectorListEl.appendChild(card);
            });
        }

        clearBtn.addEventListener('click', () => {
            vectors = [];
            nextId = 1;
            updateSidebar();
            draw();
        });

        const showResultantCheckbox = document.getElementById('show-resultant');
        if (showResultantCheckbox) {
            showResultantCheckbox.addEventListener('change', draw);
        }

    </script>
</body>

</html>
